<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Web Component Demo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .demo-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>React Web Component Demo</h1>
        <div class="demo-section">
            <h2>Basic Usage</h2>
            <my-custom-component></my-custom-component>
        </div>
        <div class="demo-section">
            <h2>With Theme</h2>
            <my-custom-component theme="dark"></my-custom-component>
        </div>
        <div class="demo-section">
            <h2>With Configuration</h2>
            <my-custom-component data-config='{"showHeader": true}'></my-custom-component>
        </div>
    </div>
</body>
</html>
